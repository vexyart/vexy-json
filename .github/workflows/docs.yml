# this_file: .github/workflows/docs.yml
# Rebuild the documentation site into docs/ on every push to the default branch.
# GitHub Pages serves docs/ at https://vexy.dev/vexy-json/.
# The WebAssembly bundle used by the live demo (docs/pkg/) is rebuilt from
# crates/wasm into src_docs/md/pkg/ first, so ProperDocs publishes a fresh copy.
name: Docs
on:
  push:
    branches: [main]
    paths:
      - "src_docs/**"
      - "crates/core/**"
      - "crates/wasm/**"
      - "scripts/build-wasm.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WebAssembly bundle for the demo
        run: ./scripts/build-wasm.sh release
      - uses: astral-sh/setup-uv@v6
      - name: Build documentation
        run: bash src_docs/build.sh
      - name: Commit rebuilt docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "docs/ unchanged"; exit 0; fi
          git commit -m "docs: rebuild site [skip ci]"
          # The WASM build regenerates tracked files outside docs/; drop them before rebasing.
          git reset -q --hard HEAD
          git pull --rebase
          git push
