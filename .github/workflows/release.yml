name: Release
# this_file: .github/workflows/release.yml

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}
  RUST_BACKTRACE: 1

jobs:
  validate-release:
    name: Validate release tag and manifests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tag is not canonical SemVer: %s\n' "$TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          python3 scripts/release-manifests.py check "$VERSION"
          printf 'tag=%s\n' "$TAG" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"

  test-release:
    name: Test tagged source
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Run canonical build and package tests
        run: ./build.sh

  create-release:
    name: Create draft GitHub release
    needs: [validate-release, test-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
              printf 'GitHub release %s already exists and is not a draft.\n' "$TAG" >&2
              exit 1
            fi
            printf 'Reusing existing draft release %s.\n' "$TAG"
          else
            gh release create "$TAG" \
              --draft \
              --generate-notes \
              --title "Vexy JSON $TAG" \
              --verify-tag
          fi

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: [validate-release, test-release, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux ARM64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CLI
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build \
            --release \
            --package vexy-json-cli \
            --bin vexy-json \
            --target "${{ matrix.target }}"

      - name: Package CLI
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          cd "target/${{ matrix.target }}/release"
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a "../../../vexy-json-$VERSION-${{ matrix.name }}.zip" vexy-json.exe
          else
            tar czf "../../../vexy-json-$VERSION-${{ matrix.name }}.tar.gz" vexy-json
          fi

      - name: Upload CLI to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "vexy-json-$VERSION-${{ matrix.name }}.${{ matrix.archive }}" \
            --clobber

  build-macos-installer:
    name: Build macOS installer
    needs: [validate-release, test-release, create-release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal CLI
        run: |
          cargo build --release --target x86_64-apple-darwin --package vexy-json-cli --bin vexy-json
          cargo build --release --target aarch64-apple-darwin --package vexy-json-cli --bin vexy-json
          lipo -create -output vexy-json \
            target/x86_64-apple-darwin/release/vexy-json \
            target/aarch64-apple-darwin/release/vexy-json
          chmod +x vexy-json

      - name: Package macOS artifacts
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          zip -9 "vexy-json-$VERSION-macos.zip" vexy-json
          mkdir -p dist/macos
          ./scripts/package-macos.sh "$VERSION"

      - name: Upload macOS artifacts to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "vexy-json-$VERSION-macos.zip" \
            "dist/macos/vexy-json-$VERSION-macos.dmg" \
            --clobber

  build-wasm:
    name: Build WASM release artifact
    needs: [validate-release, test-release, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and test WASM
        run: |
          ./scripts/build-wasm.sh release
          cp README.md docs/pkg/README.md
          cp LICENSE docs/pkg/LICENSE
          mkdir -p crates/wasm/pkg
          cp -R docs/pkg/. crates/wasm/pkg/
          node crates/wasm/test.mjs

      - name: Package WASM
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: tar czf "vexy-json-wasm-$VERSION.tar.gz" -C docs pkg

      - name: Upload WASM to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          gh release upload "$TAG" "vexy-json-wasm-$VERSION.tar.gz" --clobber

  finalize-release:
    name: Publish GitHub release
    needs:
      - validate-release
      - build-binaries
      - build-macos-installer
      - build-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
