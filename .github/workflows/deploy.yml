name: Deploy WebAssembly Tool to GitHub Pages
# this_file: .github/workflows/deploy.yml

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/core/**'
      - 'crates/wasm/**'
      - 'scripts/build-wasm.sh'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/core/**'
      - 'crates/wasm/**'
      - 'scripts/build-wasm.sh'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebAssembly site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WebAssembly module
        run: ./scripts/build-wasm.sh release

      - name: Verify site artifacts
        run: |
          test -s docs/index.html
          test -s docs/pkg/vexy_json_wasm.js
          test -s docs/pkg/vexy_json_wasm_bg.wasm
          test -s docs/pkg/vexy_json_wasm.d.ts

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
