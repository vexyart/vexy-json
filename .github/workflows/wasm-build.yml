name: Build and Test WASM
# this_file: .github/workflows/wasm-build.yml

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/core/**'
      - 'crates/wasm/**'
      - 'scripts/build-wasm.sh'
      - 'docs/**'
      - '.github/workflows/wasm-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/core/**'
      - 'crates/wasm/**'
      - 'scripts/build-wasm.sh'
      - 'docs/**'
      - '.github/workflows/wasm-build.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm:
    name: Build WebAssembly module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        run: ./scripts/build-wasm.sh release

      - name: Verify build outputs
        run: |
          test -s docs/pkg/vexy_json_wasm.js
          test -s docs/pkg/vexy_json_wasm_bg.wasm
          test -s docs/pkg/vexy_json_wasm.d.ts

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-module
          path: docs/pkg/
          retention-days: 30

  test-wasm:
    name: Test WebAssembly module
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm-module
          path: crates/wasm/pkg/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run WASM smoke tests
        run: node crates/wasm/test.mjs
