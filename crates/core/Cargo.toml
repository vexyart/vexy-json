# this_file: crates/core/Cargo.toml
[package]
name = "vexy-json-core"
version = "1.5.10"
edition = "2021"
description = "Core parser for Vexy JSON's forgiving JSON syntax"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vexyart/vexy-json"
homepage = "https://github.com/vexyart/vexy-json"
readme = "../../README.md"
keywords = [ "json", "parser", "forgiving", "relaxed", "lenient" ]
categories = [ "parsing", "data-structures" ]
publish = [ "crates-io" ]


[lib]
path = "src/lib.rs"


[dependencies]
thiserror = "2.0.12"
logos = "0.15"
serde_json = "1.0"
regex = "1.10"
rayon = "1.7"
rustc-hash = "2.0"
chrono = "0.4"


[dependencies.tokio]
version = "1.0"
features = [ "io-util" ]
optional = true


[dependencies.serde]
version = "1.0"
features = [ "derive" ]
optional = true


[features]
default = [ ]
serde = [ "dep:serde" ]
wasm = [ ]
simd = [ ]
async = [ "tokio" ]


[dev-dependencies.criterion]
version = "0.6"
features = [ "html_reports" ]


[[bench]]
name = "parser_benchmarks"
harness = false
