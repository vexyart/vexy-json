# this_file: crates/serde/Cargo.toml
[package]
name = "vexy-json-serde"
version = "1.5.11"
edition = "2021"
description = "Serde integration for Vexy JSON values"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vexyart/vexy-json"
homepage = "https://github.com/vexyart/vexy-json"
readme = "../../README.md"
keywords = [ "json", "serde", "parser", "forgiving" ]
categories = [ "parsing", "encoding" ]
publish = [ "crates-io" ]


[lib]
path = "src/lib.rs"


[dependencies.vexy-json-core]
path = "../core"
version = "=1.5.11"
features = [ "serde" ]


[dependencies.serde]
version = "1.0"
features = [ "derive" ]


[features]
serde = [ ]
