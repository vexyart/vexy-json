# this_file: crates/c-api/Cargo.toml
[package]
name = "vexy-json-c-api"
version = "1.5.12"
authors = [ "Vexy JSON Contributors" ]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C API for the vexy_json JSON parser"
repository = "https://github.com/vexyart/vexy-json"
homepage = "https://github.com/vexyart/vexy-json"
readme = "../../README.md"
keywords = [ "json", "ffi", "parser", "forgiving" ]
categories = [ "api-bindings", "parsing" ]
publish = [ "crates-io" ]


[lib]
name = "vexy_json_c_api"
crate-type = [ "cdylib", "staticlib" ]


[dependencies]
libc = "0.2"
serde_json = "1.0"


[dependencies.vexy-json-core]
path = "../core"
version = "=1.5.12"
features = [ "serde" ]


[build-dependencies]
cbindgen = "0.29"


[features]
default = [ ]
