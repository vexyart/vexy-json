# this_file: crates/python/Cargo.toml
[package]
name = "vexy-json-python"
version = "1.5.12"
edition = "2021"
description = "Python bindings for vexy_json - a forgiving JSON parser"
repository = "https://github.com/vexyart/vexy-json"
license = "MIT OR Apache-2.0"
authors = [ "Adam Twardoch <adam+github@twardoch.com>" ]
publish = false


[lib]
name = "vexy_json"
crate-type = [ "cdylib" ]


[dependencies]
rustc-hash = "2.1"


[dependencies.pyo3]
version = "0.25"
features = [ "extension-module" ]


[dependencies.vexy-json-core]
path = "../core"
version = "=1.5.12"


[build-dependencies]
pyo3-build-config = "0.25"
