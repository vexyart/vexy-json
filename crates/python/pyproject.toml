# this_file: crates/python/pyproject.toml
[build-system]
requires = [ "maturin>=1.0,<2.0" ]
build-backend = "maturin"


[project]
name = "vexy-json"
description = "Parse relaxed, configuration-style, and LLM-generated JSON with a fast Rust engine"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Developers",
"License :: OSI Approved :: MIT License",
"License :: OSI Approved :: Apache Software License",
"Operating System :: OS Independent",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.8",
"Programming Language :: Python :: 3.9",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Programming Language :: Rust",
"Typing :: Typed",
"Topic :: File Formats :: JSON",
"Topic :: Software Development :: Interpreters",
"Topic :: Software Development :: Libraries :: Python Modules",
"Topic :: Text Processing",
"Topic :: Internet :: WWW/HTTP :: Dynamic Content"
]
keywords = [
"json",
"json parser",
"relaxed json",
"forgiving json",
"json repair",
"configuration",
"llm output",
"rust",
"pyo3"
]
dynamic = [ "version" ]


[[project.authors]]
name = "Adam Twardoch"
email = "adam+github@twardoch.com"


[project.license]
text = "MIT OR Apache-2.0"


[project.urls]
Homepage = "https://github.com/vexyart/vexy-json"
Repository = "https://github.com/vexyart/vexy-json.git"
Issues = "https://github.com/vexyart/vexy-json/issues"
Documentation = "https://vexy.dev/vexy-json/"
Changelog = "https://github.com/vexyart/vexy-json/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = [ "pytest>=7.0", "pytest-benchmark>=4.0", "maturin>=1.0" ]


[tool.maturin]
features = [ "pyo3/extension-module" ]
python-source = "python"
module-name = "vexy_json._vexy_json"
include = [ "python/vexy_json/__init__.pyi", "python/vexy_json/py.typed" ]


[tool.hatch.version]
source = "vcs"


[tool.hatch.version.raw-options]
root = "../.."


[tool.pytest.ini_options]
testpaths = [ "tests" ]
python_files = [ "test_*.py", "*_test.py" ]
