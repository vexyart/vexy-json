# this_file: src_docs/mkdocs.yml
site_name: vexy-json
site_description: Forgiving JSON parser for Rust, Python, WebAssembly, C and the command line
site_url: https://vexy.dev/vexy-json/
repo_url: https://github.com/vexyart/vexy-json
repo_name: vexyart/vexy-json
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
# pkg/README.md is the README that wasm-pack copies next to the WebAssembly
# bundle; it is not a documentation page.
exclude_docs: |
  pkg/README.md
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Guide:
      - Accepted syntax: syntax.md
      - Parser options: options.md
      - Repairing incomplete input: repair.md
  - Interfaces:
      - Command line: cli.md
      - Rust API: rust-api.md
      - Python: python.md
      - JavaScript and WebAssembly: webassembly.md
      - C and C++: c-api.md
  - Project:
      - Architecture: architecture.md
      - Troubleshooting: troubleshooting.md
      - Contributing: contributing.md
